name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    # Run on the self hosted runner and only on the base repo
    if: github.repository == 'AYM1607/pec' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    runs-on: self-hosted-x64
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l # or ihp-sg13g2

  precheck:
    needs: gds
    # Run on the self hosted runner and only on the base repo
    if: github.repository == 'AYM1607/pec' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    runs-on: self-hosted-x64
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    # Run on the self hosted runner and only on the base repo
    if: github.repository == 'AYM1607/pec' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    runs-on: self-hosted-x64
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    # Run on the self hosted runner and only on the base repo
    if: github.repository == 'AYM1607/pec' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    runs-on: self-hosted-x64
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
